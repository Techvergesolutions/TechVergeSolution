{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Will callers know they are talking to an AI voice agent?","acceptedAnswer":{"@type":"Answer","text":"That depends on your disclosure policy. Many US small businesses choose clear, professional transparency plus an easy path to a human. Build the wording into the opening script rather than leaving it to chance."}},{"@type":"Question","name":"Can an AI voice agent replace our receptionist entirely?","acceptedAnswer":{"@type":"Answer","text":"Usually not as a full replacement. Most successful setups cover a defined set of call types — after-hours intake, FAQs, booking — and escalate exceptions. Think coverage and consistency, not a one-for-one headcount swap."}},{"@type":"Question","name":"How long does a focused inbound pilot usually take?","acceptedAnswer":{"@type":"Answer","text":"A narrow use case can often reach a pilot in a few weeks once calendar or CRM access, scripts, and escalation rules are ready. Broader multi-intent rollouts take longer because edge-case testing matters."}},{"@type":"Question","name":"What do we need before we start?","acceptedAnswer":{"@type":"Answer","text":"Examples of real calls or scripts, hours of operation, booking rules, FAQs, a list of what the agent must never say or do, and a stakeholder who can approve tone and handoffs. Messy processes are normal — documenting them is part of discovery."}},{"@type":"Question","name":"Do we have to change our phone carrier or CRM?","acceptedAnswer":{"@type":"Answer","text":"Not always. Many builds connect to the tools you already use. The right answer depends on call routing, recording requirements, and how your team works today — discovery should map that before anyone promises a stack switch."}}]}
